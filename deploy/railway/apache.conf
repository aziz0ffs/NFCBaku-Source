<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /app
    DirectoryIndex index.php

    <Directory /app>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    # Reject sensitive paths before Laravel sees them, including backup/runtime data.
    RewriteRule ^/(?:\.env(?:\..*)?|database(?:/|$)|storage(?:/|$)|vendor(?:/|$)|config(?:/|$)|bootstrap(?:/|$)|app(?:/|$)|routes(?:/|$)|backups(?:/|$)|\.git(?:/|$)) - [F,END,NC]
    RewriteRule ^/(?:composer\.|package\.|phpunit\.|version\.json$|Dockerfile$|artisan$|server\.php$|LICENSE$|README\.|DEPLOY_RAILWAY\.) - [F,END,NC]
    # Only the front controller and explicitly allowed public assets are served.
    # Never expose .env, database/, storage/, vendor/, config/, or PHP source.
    RewriteRule ^/(?:assets|themes|resources/ckeditor)/.+\.(?:css|js|png|jpe?g|gif|webp|ico|svg|woff2?|ttf|eot|otf|map|pdf|txt|mp4|webm|avif)$ - [END,NC]
    RewriteRule !^/index\.php$ /index.php [END]

    <LocationMatch "^/(?:assets|themes|resources/ckeditor)/.*\.(?:php|phtml|phar|cgi|pl|sh)(?:/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
